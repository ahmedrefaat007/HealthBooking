name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, "001-distributed-healthcare-system"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore HealthBooking.sln

      - name: Format check
        run: dotnet format --verify-no-changes HealthBooking.sln

      - name: Build
        run: dotnet build HealthBooking.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test HealthBooking.sln --no-build --configuration Release
              --collect:"XPlat Code Coverage"
              --results-directory ./coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./coverage
