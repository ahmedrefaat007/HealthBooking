services:

  # ─── Databases ────────────────────────────────────────────────────────────────

  sqlserver-patient:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${SQL_SA_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-patient-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa",
             "-P", "${SQL_SA_PASSWORD}", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sqlserver-provider:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${SQL_SA_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - sqlserver-provider-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa",
             "-P", "${SQL_SA_PASSWORD}", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sqlserver-appointment:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${SQL_SA_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1435:1433"
    volumes:
      - sqlserver-appointment-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa",
             "-P", "${SQL_SA_PASSWORD}", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sqlserver-notification:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${SQL_SA_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1436:1433"
    volumes:
      - sqlserver-notification-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa",
             "-P", "${SQL_SA_PASSWORD}", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sqlserver-identity:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${SQL_SA_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1437:1433"
    volumes:
      - sqlserver-identity-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa",
             "-P", "${SQL_SA_PASSWORD}", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Messaging ────────────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Cache ────────────────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Observability ────────────────────────────────────────────────────────────

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"    # Jaeger UI
      - "4317:4317"      # OTLP gRPC
      - "4318:4318"      # OTLP HTTP
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Application services ──────────────────────────────────────────────────────

  identity-server:
    build:
      context: .
      dockerfile: src/IdentityServer/HealthBooking.IdentityServer/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:5005"
      ConnectionStrings__IdentityDb: "${IDENTITY_DB_CONNSTRING}"
      OtelExporter__Endpoint: "${JAEGER_OTLP_ENDPOINT}"
    ports:
      - "5005:5005"
    depends_on:
      sqlserver-identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://localhost:5005/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  patient-service:
    build:
      context: .
      dockerfile: src/Services/PatientService/PatientService.API/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:5001"
      ConnectionStrings__PatientDb: "${PATIENT_DB_CONNSTRING}"
      ConnectionStrings__RabbitMq: "${RABBITMQ_URL}"
      GrpcClients__IdentityServer: "http://identity-server:5005"
      IdentityServer__BaseUrl: "http://identity-server:5005"
      OtelExporter__Endpoint: "${JAEGER_OTLP_ENDPOINT}"
    ports:
      - "5001:5001"
    depends_on:
      sqlserver-patient:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://localhost:5001/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  provider-service:
    build:
      context: .
      dockerfile: src/Services/ProviderService/ProviderService.API/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:5002"
      ConnectionStrings__ProviderDb: "${PROVIDER_DB_CONNSTRING}"
      ConnectionStrings__RabbitMq: "${RABBITMQ_URL}"
      ConnectionStrings__Redis: "${REDIS_URL}"
      IdentityServer__BaseUrl: "http://identity-server:5005"
      OtelExporter__Endpoint: "${JAEGER_OTLP_ENDPOINT}"
    ports:
      - "5002:5002"
    depends_on:
      sqlserver-provider:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://localhost:5002/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  appointment-service:
    build:
      context: .
      dockerfile: src/Services/AppointmentService/AppointmentService.API/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:5003"
      ConnectionStrings__AppointmentDb: "${APPOINTMENT_DB_CONNSTRING}"
      ConnectionStrings__RabbitMq: "${RABBITMQ_URL}"
      GrpcClients__PatientService: "http://patient-service:5001"
      GrpcClients__ProviderService: "http://provider-service:5002"
      IdentityServer__BaseUrl: "http://identity-server:5005"
      OtelExporter__Endpoint: "${JAEGER_OTLP_ENDPOINT}"
    ports:
      - "5003:5003"
    depends_on:
      sqlserver-appointment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      provider-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://localhost:5003/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  notification-service:
    build:
      context: .
      dockerfile: src/Services/NotificationService/NotificationService.API/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:5004"
      ConnectionStrings__NotificationDb: "${NOTIFICATION_DB_CONNSTRING}"
      ConnectionStrings__RabbitMq: "${RABBITMQ_URL}"
      GrpcClients__PatientService: "http://patient-service:5001"
      IdentityServer__BaseUrl: "http://identity-server:5005"
      OtelExporter__Endpoint: "${JAEGER_OTLP_ENDPOINT}"
    ports:
      - "5004:5004"
    depends_on:
      sqlserver-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      patient-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://localhost:5004/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/HealthBooking.ApiGateway/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:5000"
      IdentityServer__Authority: "http://identity-server:5005"
      OtelExporter__Endpoint: "${JAEGER_OTLP_ENDPOINT}"
    ports:
      - "5000:5000"
    depends_on:
      patient-service:
        condition: service_healthy
      provider-service:
        condition: service_healthy
      appointment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://localhost:5000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  sqlserver-patient-data:
  sqlserver-provider-data:
  sqlserver-appointment-data:
  sqlserver-notification-data:
  sqlserver-identity-data:
  rabbitmq-data:
  redis-data:
